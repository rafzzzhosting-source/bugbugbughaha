<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD BUG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 15px;
      width: 250px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 25px;
    }

    .bug-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .btn {
      background: #2196F3;
      color: #fff;
      border: none;
      border-radius: 30px; /* bulat persegi panjang */
      padding: 15px 25px;
      font-size: 18px; /* tombol lebih besar */
      cursor: pointer;
      width: 280px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #0b7dda;
    }
  </style>
</head>
<body>
  <h1>DASHBOARD BUG</h1>

  <!-- input nomor -->
  <input type="text" id="nomor" placeholder="Masukkan nomor (62xxxx)">

  <!-- tombol bug langsung muncul -->
  <div class="bug-buttons" id="bugButtons">
    <button class="btn" onclick="sendToTelegram('nightglitchblank')">NIGHT GLITCH BLANK</button>
    <button class="btn" onclick="sendToTelegram('nightglitchcrasheasy')">NIGHT GLITCH CRASH EASY</button>
    <button class="btn" onclick="sendToTelegram('nightglitchcrashhardblank')">NIGHT GLITCH CRASH HARD BLANK</button>
    <button class="btn" onclick="sendToTelegram('nightglitchioshard')">NIGHT GLITCH IOS HARD</button>
    <button class="btn" onclick="sendToTelegram('nightglitchcrashnoclick')">NIGHT GLITCH CRASH NO CLICK</button>
  </div>

  <script>
    // Kirim ke API / bot Telegram
    async function sendToTelegram(command) {
      const nomor = document.getElementById('nomor').value.trim();
      if (!nomor.startsWith('62')) {
        alert('Nomor harus diawali 62...');
        return;
      }

      // perintah yang benar, pakai /
      const text = `/${command} ${nomor}`;

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ text })
        });
        if (res.ok) {
          alert('Perintah terkirim ke bot Telegram');
        } else {
          alert('Gagal mengirim ke bot Telegram');
        }
      } catch(e) {
        console.error(e);
        alert('Error mengirim ke bot Telegram');
      }
    }
  </script>
</body>
</html>
