<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Night Glitch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: #111;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
      width: 420px;
      text-align: center;
    }
    .glow-text {
      font-size: 30px;
      letter-spacing: 2px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000,
                   0 0 20px #ff0000,
                   0 0 40px #ff0000;
      margin-bottom: 18px;
    }
    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px;
    }
    .login-box h2 {
      margin-bottom: 25px;
      color: #ff0000;
      font-size: 24px;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
      color: #ff0000;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ff0000;
      background: #000;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }
    .input-group input:focus {
      border-color: #ff3333;
      box-shadow: 0 0 6px #ff0000;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #ff0000;
      border: none;
      color: #fff;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Orbitron', sans-serif;
    }
    .btn:hover {
      background: #cc0000;
      box-shadow: 0 0 12px #ff0000;
    }
    .message {
      margin-top: 18px;
      font-size: 15px;
      color: #ff0000;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="glow-text">WELCOME TO NIGHT GLITCH</div>
    <img src="https://files.catbox.moe/1k8abd.png" alt="Logo" class="logo">

    <h2>Login</h2>
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username">
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
    </div>
    <button class="btn" onclick="login()">Login</button>
    <div class="message" id="message"></div>
  </div>

  <audio id="bg-music" src="https://www.example.com/lagu.mp3" autoplay loop></audio>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      // username & password statis
      const validUser = "admin";
      const validPass = "12345";

      if (username === validUser && password === validPass) {
        message.style.color = "lime";
        message.textContent = "Login berhasil!";
        setTimeout(() => {
          window.location.href = "dashboard.html"; // ke halaman menu
        }, 1000);
      } else {
        message.style.color = "#ff0000";
        message.textContent = "Username atau password salah!";
      }
    }

    // musik hidup setelah klik pertama
    document.addEventListener('click', () => {
      const audio = document.getElementById('bg-music');
      if (audio.paused) {
        audio.play().catch(err=>console.log(err));
      }
    }, {once:true});
  </script>
</body>
</html>
