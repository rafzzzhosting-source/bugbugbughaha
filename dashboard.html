<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Night Glitch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: #000;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      padding: 15px 20px;
    }
    .header h1 {
      color: #ff0000;
      font-size: 22px;
      margin: 0;
    }
    .logo {
      display: block;
      margin: 10px auto;
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    .content {
      text-align: center;
      margin-top: 10px;
    }
    .content h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000,
                   0 0 20px #ff0000,
                   0 0 30px #ff0000;
    }
    .input-number {
      padding: 10px;
      width: 250px;
      border: 1px solid #ff0000;
      background: #000;
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      width: 250px;
      font-family: 'Orbitron', sans-serif;
    }
    .btn:hover {
      background: #cc0000;
      box-shadow: 0 0 10px #ff0000;
    }
    .bug-buttons {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      gap: 8px;
    }
    .bug-buttons .btn {
      width: 250px;
    }
  </style>
</head>
<body>
  <!-- Header kiri atas -->
  <div class="header">
    <h1>NIGHT GLITCH V1</h1>
  </div>

  <!-- Logo di atas -->
  <img src="https://files.catbox.moe/1k8abd.png" alt="Logo" class="logo">

  <div class="content">
    <h2>MASUKAN NOMOR</h2>
    <!-- Input nomor (tanpa tombol masukan) -->
    <input type="text" class="input-number" placeholder="Ketik nomor di sini">

    <!-- Tombol ★LIST ALL BUG★ -->
    <button class="btn" onclick="showAllBugs()">★ LIST ALL BUG ★</button>

    <!-- Tombol-tombol bug muncul langsung -->
    <div class="bug-buttons" id="bugButtons">
      <button class="btn">NIGHT GLITCH BLANK</button>
      <button class="btn">NIGHT GLITCH CRASH EASY</button>
      <button class="btn">NIGHT GLITCH CRASH HARD BLANK</button>
      <button class="btn">NIGHT GLITCH IOS HARD</button>
      <button class="btn">NIGHT GLITCH CRASH NO CLICK</button>
    </div>
  </div>

  <script>
    let bugVisible = false;
    function showAllBugs() {
      const bugContainer = document.getElementById('bugButtons');
      if (!bugVisible) {
        bugContainer.style.display = 'flex';
        bugVisible = true;
      } else {
        bugContainer.style.display = 'none';
        bugVisible = false;
      }
    }
  </script>
</body>
</html>
